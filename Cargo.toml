[workspace]
resolver = "2"
members = [
    "core",
    "vectors",
    "provider",
    "firmware/hal",
    "firmware/host",
]
# Not workspace members: firmware/esp32s3 (needs the xtensa/riscv esp toolchain),
# firmware/dabao (built with `cargo xtask dabao` inside xous-core), web (wasm-pack),
# tvc-app (built as an OCI image). Each has its own README.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourbuddyconner/cahoots"

[workspace.dependencies]
cahoots-core = { path = "core", default-features = false }
cahoots-hal = { path = "firmware/hal" }
sha2 = { version = "0.10", default-features = false }
poly1305 = { version = "0.8", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
crc = { version = "3.3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
proptest = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
