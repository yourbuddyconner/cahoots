[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/vectors",
    "crates/custodian",
    "crates/provider",
    "crates/hal",
    "crates/badge",
    "crates/host",
    "crates/wasm",
    "crates/hpke",
    "crates/wireguard",
    "crates/age-plugin-cahoots",
    "crates/chat",
    "crates/objects",
    "crates/channel",
    "crates/station",
    "crates/relay",
    "crates/chip",
]
exclude = ["crates/fuzz", "crates/esp32s3", "crates/rp2350", "crates/dabao"]
# Not workspace members: crates/esp32s3 (needs the esp toolchain), crates/rp2350 (thumbv8m target, own config), crates/dabao (built with
# `cargo xtask dabao` inside xous-core), crates/fuzz (cargo-fuzz, nightly), web/app (static PWA).
# The station ships as an OCI image for Turnkey Verifiable Cloud (https://docs.turnkey.com/features/verifiable-cloud/overview). Each has its own README.

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/yourbuddyconner/cahoots"

[workspace.dependencies]
cahoots-core = { path = "crates/core", default-features = false }
cahoots-hal = { path = "crates/hal" }
cahoots-badge = { path = "crates/badge", default-features = false }
cahoots-custodian = { path = "crates/custodian", default-features = false }
cahoots-provider = { path = "crates/provider" }
cahoots-chat = { path = "crates/chat", default-features = false }
cahoots-objects = { path = "crates/objects", default-features = false }
cahoots-channel = { path = "crates/channel", default-features = false }
cahoots-station = { path = "crates/station" }
cahoots-chip = { path = "crates/chip", default-features = false }
sha2 = { version = "0.10", default-features = false }
poly1305 = { version = "0.8", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false }
crc = { version = "3.3", default-features = false }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
hex = { version = "0.4", default-features = false, features = ["alloc"] }
proptest = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"

# The wasm client decodes camera frames in software; speed matters more than size there.
[profile.release.package.cahoots-wasm]
opt-level = 3
[profile.release.package.rqrr]
opt-level = 3
[profile.release.package.raptorq]
opt-level = 3
