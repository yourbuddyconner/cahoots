<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t">
<title id="t">The pad: everyone holds all of it, each member sends from their own part</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5a33a"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b74" stroke-width="1.5"/></pattern>
</defs>
<rect width="960" height="330" rx="16" fill="#0e0e10"/>
<text x="20" y="36" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" font-weight="600" fill="#f4f4f5" text-anchor="start">One shared secret, held in full by every member</text>
<text x="20" y="58" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start">256 KiB of random bytes. Each byte is used once, then erased on every device.</text>
<rect x="20" y="86" width="920" height="64" rx="8" fill="#151518" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="32.0" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f4f5" text-anchor="start">Ana's part</text>
<text x="32.0" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b74" text-anchor="start">only they send from here</text>
<line x1="250.0" y1="86" x2="250.0" y2="150" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="262.0" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f4f5" text-anchor="start">Ben's part</text>
<text x="262.0" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b74" text-anchor="start">only they send from here</text>
<line x1="480.0" y1="86" x2="480.0" y2="150" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="492.0" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f4f5" text-anchor="start">Cy's part</text>
<text x="492.0" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b74" text-anchor="start">only they send from here</text>
<line x1="710.0" y1="86" x2="710.0" y2="150" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="722.0" y="108" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="500" fill="#f4f4f5" text-anchor="start">Dee's part</text>
<text x="722.0" y="128" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="400" fill="#6b6b74" text-anchor="start">only they send from here</text>
<rect x="32" y="136" width="60" height="8" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1"/>
<rect x="262.0" y="136" width="28" height="8" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1"/>
<rect x="298.0" y="136" width="90" height="8" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1"/>
<rect x="722.0" y="136" width="40" height="8" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1"/>
<rect x="492.0" y="136" width="120" height="8" rx="2" fill="#e5a33a" stroke="none" stroke-width="1"/>
<rect x="20" y="173" width="22" height="8" rx="2" fill="url(#hatch)" stroke="none" stroke-width="1"/>
<text x="50" y="181" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">spent and erased</text>
<rect x="190" y="173" width="22" height="8" rx="2" fill="#e5a33a" stroke="none" stroke-width="1"/>
<text x="220" y="181" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">being spent now: Cy is sending a message</text>
<circle cx="26" cy="220" r="3" fill="#e5a33a" stroke="none" stroke-width="1"/>
<text x="40" y="224" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#f4f4f5" text-anchor="start">Everyone holds the whole pad</text>
<text x="380" y="224" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start">so anyone in the group can read any message.</text>
<circle cx="26" cy="250" r="3" fill="#e5a33a" stroke="none" stroke-width="1"/>
<text x="40" y="254" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#f4f4f5" text-anchor="start">Each member sends from their own part</text>
<text x="380" y="254" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start">so two people never use the same bytes by accident.</text>
<circle cx="26" cy="280" r="3" fill="#e5a33a" stroke="none" stroke-width="1"/>
<text x="40" y="284" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#f4f4f5" text-anchor="start">Every device erases bytes as they are used</text>
<text x="380" y="284" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#a1a1aa" text-anchor="start">so a device lost later cannot decrypt what was already sent.</text>
</svg>
