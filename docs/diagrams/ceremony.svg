<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 532" width="960" height="532" role="img" aria-labelledby="t">
<title id="t">The ceremony in five steps</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5a33a"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b74" stroke-width="1.5"/></pattern>
</defs>
<rect width="960" height="532" rx="16" fill="#0e0e10"/>
<rect x="20" y="28" width="920" height="80" rx="12" fill="#151518" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="36" y="76" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#e5a33a" text-anchor="start">01</text>
<text x="84" y="77" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="start">Set up</text>
<text x="330" y="64" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">One person names the group and the member count. Every device shows it.</text>
<text x="330" y="86" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">Everyone confirms.</text>
<line x1="44" y1="108" x2="44" y2="119" stroke="#6b6b74" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="120" width="920" height="80" rx="12" fill="#151518" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="36" y="168" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#e5a33a" text-anchor="start">02</text>
<text x="84" y="169" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="start">Draw</text>
<text x="330" y="156" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">Each device makes its own random bytes and locks them in with a</text>
<text x="330" y="178" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">fingerprint, before it sees anyone else's.</text>
<line x1="44" y1="200" x2="44" y2="211" stroke="#6b6b74" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="212" width="920" height="80" rx="12" fill="#151518" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="36" y="260" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#e5a33a" text-anchor="start">03</text>
<text x="84" y="261" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="start">Touch</text>
<text x="330" y="248" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">Devices connect in a ring. First the fingerprints go around, then the</text>
<text x="330" y="270" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">bytes. Nothing uses a radio.</text>
<line x1="44" y1="292" x2="44" y2="303" stroke="#6b6b74" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="304" width="920" height="80" rx="12" fill="#151518" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="36" y="352" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#e5a33a" text-anchor="start">04</text>
<text x="84" y="353" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="start">Mix</text>
<text x="330" y="340" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">Every device combines all the bytes into one secret. One honest member</text>
<text x="330" y="362" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">is enough to make it random.</text>
<line x1="44" y1="384" x2="44" y2="395" stroke="#6b6b74" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="20" y="396" width="920" height="80" rx="12" fill="#151518" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="36" y="444" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" font-weight="400" fill="#e5a33a" text-anchor="start">05</text>
<text x="84" y="445" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#f4f4f5" text-anchor="start">Say the words</text>
<text x="330" y="432" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">Six words appear on every screen. Read them aloud. If they match, the</text>
<text x="330" y="454" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" fill="#a1a1aa" text-anchor="start">group is in cahoots.</text>
<text x="480" y="510" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12.5" font-weight="400" fill="#6b6b74" text-anchor="middle">Steps 2 and 3 are what stop anyone from choosing their bytes after seeing everyone else's.</text>
</svg>
