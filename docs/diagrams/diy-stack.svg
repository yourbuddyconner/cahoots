<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t">
<title id="t">The stack: screen hat on top, secure element wedged between, Pico below</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5a33a"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b74" stroke-width="1.5"/></pattern>
</defs>
<rect width="960" height="300" rx="16" fill="#0e0e10"/>
<rect x="110" y="60" width="440" height="40" rx="8" fill="#2a2f3a" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="330" y="85" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">Screen hat (Waveshare Pico-LCD-1.3)</text>
<text x="580" y="85" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">faces out: 240 × 240 screen, joystick, four buttons</text>
<rect x="110" y="118" width="440" height="40" rx="8" fill="#1f2a44" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="330" y="143" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">Trust M breakout + cable</text>
<text x="580" y="143" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">lies flat between the boards, port toward the USB end</text>
<rect x="110" y="176" width="440" height="40" rx="8" fill="#1b4d3e" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="330" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">Pico 2 with headers</text>
<text x="580" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">pins up into the hat's header; USB at the end</text>
<line x1="140" y1="100" x2="140" y2="176" stroke="#d4af37" stroke-width="2"/>
<line x1="520" y1="100" x2="520" y2="176" stroke="#d4af37" stroke-width="2"/>
<text x="130" y="148" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#d4af37" text-anchor="end">header</text>
<rect x="90" y="40" width="480" height="196" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 6"/>
<text x="330" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b74" text-anchor="middle">A snap case holds the three together. Nothing is glued or soldered.</text>
</svg>
