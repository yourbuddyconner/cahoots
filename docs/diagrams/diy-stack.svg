<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" width="960" height="300" role="img" aria-labelledby="t">
<title id="t">The stack: e-paper on top, buttons and secure element between, the board below</title>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#a1a1aa"/></marker>
<marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#e5a33a"/></marker>
<pattern id="hatch" patternUnits="userSpaceOnUse" width="6" height="6" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="6" stroke="#6b6b74" stroke-width="1.5"/></pattern>
</defs>
<rect width="960" height="300" rx="16" fill="#0e0e10"/>
<rect x="110" y="60" width="440" height="40" rx="8" fill="#2a2f3a" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="330" y="85" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">E-paper screen</text>
<text x="580" y="85" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">1.54" 200 × 200 on the Baochip; a 2.13" hat on the Pico</text>
<rect x="110" y="118" width="440" height="40" rx="8" fill="#1f2a44" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="330" y="143" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">Two buttons · secure element (Pico only)</text>
<text x="580" y="143" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">Pico: one Qwiic chain. Baochip: buttons only</text>
<rect x="110" y="176" width="440" height="40" rx="8" fill="#1b4d3e" stroke="rgba(255,255,255,0.14)" stroke-width="1"/>
<text x="330" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f4f4f5" text-anchor="middle">The board: Dabao or Pico 2</text>
<text x="580" y="201" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#a1a1aa" text-anchor="start">USB-C to the phone; a wire to the next badge</text>
<line x1="140" y1="100" x2="140" y2="176" stroke="#d4af37" stroke-width="2"/>
<line x1="520" y1="100" x2="520" y2="176" stroke="#d4af37" stroke-width="2"/>
<text x="130" y="148" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="10" font-weight="400" fill="#d4af37" text-anchor="end">header</text>
<rect x="90" y="40" width="480" height="196" rx="14" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" stroke-dasharray="6 6"/>
<text x="330" y="262" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="400" fill="#6b6b74" text-anchor="middle">Same shape in both families. The Pico build snaps together; the Dabao build needs a header.</text>
</svg>
