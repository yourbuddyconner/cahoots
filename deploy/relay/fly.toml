# The default relay for the Cahoots app: relay.cahoots.network.
# Deploy from the repository root:  fly launch --copy-config --no-deploy  (once)  then  fly deploy
# The database lives on a volume; create it once with:  fly volumes create station_data --size 1
app = "cahoots-relay"
primary_region = "sjc"

[build]
  dockerfile = "../../crates/station/Dockerfile"

[env]
  # Nothing secret. Flags are set on the command line below.

[processes]
  # Fly terminates HTTPS and sets Fly-Client-IP, so the station can trust it for the rate limit.
  # The cap is 4 GiB, measured as the database file plus its write-ahead log; a chat message is
  # about 200 bytes in the database, so that is about twenty million messages.
  # The image's ENTRYPOINT already runs the binary with --listen and --db; Fly appends this to it.
  app = "--trust-forwarded --posts-per-minute 120 --reads-per-minute 600 --max-log-bytes 4294967296"

[[mounts]]
  source = "station_data"
  destination = "/data"
  processes = ["app"]

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
