[package]
name = "cahoots-station"
description = "The Numbers Station: an append-only, hash-chained public relay for circle ciphertext. Built as a TVC (Turnkey Verifiable Cloud, https://docs.turnkey.com/features/verifiable-cloud/overview) workload."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "cahoots-station"
path = "src/main.rs"

[dependencies]
cahoots-core = { workspace = true, features = ["std"] }
axum = { version = "0.7.9", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net", "sync", "time", "fs", "signal"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
clap = { version = "4.5", features = ["derive"] }
thiserror = "2.0"
tower-http = { version = "0.6", features = ["cors"] }
http = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
cahoots-objects = { workspace = true, features = ["std"], optional = true }
cahoots-channel = { workspace = true, features = ["std"], optional = true }

[features]
default = ["feed-page"]
# The live feed page at `/`.
feed-page = []
# Manifests, channel objects, policies, grants, revocations, deposits, join requests.
objects = ["dep:cahoots-objects", "dep:cahoots-channel"]
# Version 3 messages chained per channel.
channels = ["objects"]
# Read and post checks on channels.
gate = ["channels"]
# The relay issues grants under its own key (TVC build only).
issuer = ["gate"]
# Periodic head anchoring to the TVC log.
anchor = []

[dev-dependencies]
tempfile = "3.10"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
