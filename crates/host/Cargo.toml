[package]
name = "cahoots-host"
description = "Desktop simulator target for Cahoots badges: socket Link, file PadStore, PNG Display."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
default-run = "cahoots-host"

[dependencies]
cahoots-core = { workspace = true, features = ["std"] }
cahoots-hal = { workspace = true, features = ["std"] }
cahoots-badge = { workspace = true, features = ["std"] }
cahoots-custodian = { workspace = true, features = ["std"] }
png = "0.17"
base64 = "0.22"
getrandom = "0.3"
serialport = { version = "4", default-features = false }
libc = "0.2"
zeroize = { workspace = true, features = ["alloc"] }
cahoots-chip = { workspace = true, features = ["std"] }
cahoots-objects = { workspace = true, features = ["std"] }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ecdsa", "p256", "ed25519"] }
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc", "base64"] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "std"] }
sha2 = { workspace = true, features = ["std"] }
sha1 = "0.10"
hmac = "0.12"
serde_json = { workspace = true }
cahoots-relay = { path = "../relay" }
rand_core = { version = "0.6", features = ["getrandom"] }
qrcode = { version = "0.14.1", default-features = false }

[dev-dependencies]
cahoots-phone = { path = "../phone" }
cahoots-relay = { path = "../relay" }
hex = { workspace = true }
tempfile = "3"
cahoots-chat = { workspace = true }
ssh-key = { version = "0.6", default-features = false, features = ["std", "ecdsa", "p256", "ed25519", "rand_core", "getrandom"] }
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc"] }
signature = "2"
