[package]
name = "cahoots-phone"
description = "The iOS app's state machine over the Cahoots crates: ceremonies, circles, chat and records, behind UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# staticlib for the iOS framework, cdylib for uniffi-bindgen to read the interface from, lib for the tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
cahoots-core = { workspace = true, features = ["std"] }
cahoots-chat = { workspace = true, features = ["std"] }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
minicbor = { version = "2.3", features = ["alloc", "derive", "std"] }
raptorq = "2.0.0"
qrcode = { version = "0.14.1", default-features = false }
rqrr = "0.11"
base64 = "0.22"
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
hex = { workspace = true }
getrandom = "0.2"
zeroize = { workspace = true, features = ["alloc"] }

[dev-dependencies]
cahoots-relay = { path = "../relay" }
tempfile = "3.10"
