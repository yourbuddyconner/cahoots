[package]
name = "cahoots-phone"
description = "The iOS app's state machine over the Cahoots crates: ceremonies, circles, chat and records, behind UniFFI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lib]
# staticlib for the iOS framework, cdylib for uniffi-bindgen to read the interface from, lib for the tests.
crate-type = ["lib", "staticlib", "cdylib"]

[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi-bindgen.rs"

[dependencies]
cahoots-core = { workspace = true, features = ["std"] }
cahoots-chat = { workspace = true, features = ["std"] }
# The channel owner and member cores, shared with the browser.
cahoots-channel = { workspace = true, features = ["std"] }
uniffi = { version = "0.29", features = ["cli"] }
thiserror = "2"
minicbor = { version = "2.3", features = ["alloc", "derive", "std"] }
raptorq = "2.0.0"
qrcode = { version = "0.14.1", default-features = false }
rqrr = "0.11"
base64 = "0.22"
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
hex = { workspace = true }
getrandom = "0.2"
rand_core = { version = "0.6", features = ["getrandom"] }
zeroize = { workspace = true, features = ["alloc"] }
url = "2.5"

[dev-dependencies]
cahoots-relay = { path = "../relay" }
cahoots-wasm = { path = "../wasm" }
tempfile = "3.10"
# The channel tests run a real station in process and reach it over HTTP.
cahoots-station = { path = "../station", features = ["objects", "channels", "gate"] }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }
ureq = { version = "2.12", default-features = false }
