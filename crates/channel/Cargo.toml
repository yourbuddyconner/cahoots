[package]
name = "cahoots-channel"
description = "Channels: a group chat published under a circle. The channel object and its policy, as COSE-signed canonical CBOR. no_std + alloc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
std = ["hpke", "dep:getrandom","cahoots-core/std", "cahoots-objects/std", "cahoots-chat/std", "hkdf/std", "zeroize/std"]
# Key deposits: HPKE base-mode sealing to a member's X-Wing key. `cahoots-hpke` needs std.
hpke = ["dep:cahoots-hpke", "dep:rand_core"]

[dependencies]
cahoots-chat = { workspace = true }
cahoots-core = { workspace = true }
cahoots-hpke = { path = "../hpke", optional = true }
cahoots-objects = { workspace = true }
# The randomness of `member` and `owner`, under `std`.
getrandom = { version = "0.2", optional = true }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12.4", default-features = false }
minicbor = { version = "2.3", default-features = false, features = ["alloc", "derive"] }
rand_core = { version = "0.10", default-features = false, optional = true }
sha2 = { workspace = true }
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[dev-dependencies]
cahoots-hpke = { path = "../hpke" }
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
hex = { workspace = true, features = ["std"] }
rand = "0.10"
serde_json = { workspace = true }
sha2 = { workspace = true, features = ["std"] }
