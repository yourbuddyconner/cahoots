[package]
name = "cahoots-chat"
description = "Pad-seeded end-to-end encrypted chat: epoch keys from pad spends, per-sender symmetric ratchets, ChaCha20-Poly1305."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["cahoots-core/std", "sha2/std", "zeroize/std"]

[dependencies]
cahoots-core = { workspace = true }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12"
serde_json = "1"
