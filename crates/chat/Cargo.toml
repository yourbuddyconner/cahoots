[package]
name = "cahoots-chat"
description = "End-to-end encrypted chat: epoch keys from the circle root, per-sender symmetric ratchets, ChaCha20-Poly1305."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["std"]
std = ["cahoots-core/std", "sha2/std", "zeroize/std"]
# The demo binary and the file-backed client. Pulls std-only dependencies.
cli = [
    "std",
    "dep:cahoots-provider",
    "dep:clap",
    "dep:ureq",
    "dep:cahoots-relay",
    "dep:serde_json",
    "dep:base64",
    "dep:getrandom",
    "dep:hex",
]

[[bin]]
name = "cahoots-chat"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
cahoots-core = { workspace = true }
chacha20poly1305 = { version = "0.10.1", default-features = false, features = ["alloc"] }
hkdf = { version = "0.12.4", default-features = false }
sha2 = { version = "0.10.9", default-features = false }
subtle = { version = "2.6", default-features = false }
zeroize = { version = "1.8", default-features = false, features = ["alloc", "derive"] }
cahoots-provider = { path = "../provider", optional = true }
clap = { version = "4.5", features = ["derive"], optional = true }
ureq = { version = "2.12", default-features = false, features = ["json"], optional = true }
cahoots-relay = { path = "../relay", optional = true }
serde_json = { version = "1", optional = true }
base64 = { version = "0.22", optional = true }
getrandom = { version = "0.2", optional = true }
hex = { version = "0.4", optional = true }

[dev-dependencies]
hex = "0.4.3"
proptest = "1.12"
serde_json = "1"
cahoots-station = { path = "../station" }
tokio = { version = "1.44", features = ["rt-multi-thread", "macros", "net"] }
axum = { version = "0.7.9", default-features = false, features = ["http1", "tokio"] }
tempfile = "3.10"
