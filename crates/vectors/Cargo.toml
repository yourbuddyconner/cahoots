[package]
name = "cahoots-vectors"
description = "Generates and checks the JSON test vectors every Cahoots client must pass."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
cahoots-core = { workspace = true, features = ["std"] }
cahoots-objects = { workspace = true, features = ["std"] }
cahoots-badge = { workspace = true }
cahoots-channel = { workspace = true, features = ["std"] }
cahoots-hpke = { path = "../hpke" }
rand = "0.10"
cahoots-custodian = { workspace = true }
serde = { workspace = true, features = ["std"] }
serde_json = { workspace = true }
hex = { workspace = true, features = ["std"] }
sha2 = { workspace = true, features = ["std"] }
