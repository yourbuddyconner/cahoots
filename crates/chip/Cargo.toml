[package]
name = "cahoots-chip"
description = "The operations a badge's secure element offers (keys that sign but never leave, HMAC keys, counters, attestation) as a trait, with a software chip for tests. no_std + alloc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["std"]
# `SoftChip::new()`, seeded from the system, and `SoftChip::apdu`, the software chip's APDU front
# end with SCP03. The crate stays no_std either way; on bare metal (`target_os = "none"`) there
# is no system source, so `new` is not there.
std = ["dep:getrandom", "dep:aes", "dep:cmac", "dep:cbc"]
# The SE051 backend over I2C, for the firmware only. The driver is LGPL-3.0-only; see
# crates/rp2350/README.md.
se05x = ["dep:se05x", "dep:embedded-hal", "dep:iso7816"]
# `Se05xChip::raw`, the firmware's APDU pass-through for the laptop. For bench builds only: it
# sends any command to the chip in no session.
bench = ["se05x"]

[dependencies]
minicbor = { version = "2.3", default-features = false, features = ["alloc", "derive"] }
sha2 = { workspace = true }
hmac = { version = "0.12", default-features = false }
p256 = { version = "0.13", default-features = false, features = ["ecdsa", "arithmetic"] }
ed25519-dalek = { version = "2", default-features = false, features = ["alloc", "rand_core", "zeroize"] }
rand_core = { version = "0.6", default-features = false }
# SCP03 in the software chip's APDU front end, with `std` only: the firmware never builds it.
aes = { version = "0.8", default-features = false, optional = true }
cmac = { version = "0.7", default-features = false, optional = true }
cbc = { version = "0.1", default-features = false, features = ["block-padding"], optional = true }
se05x = { version = "=0.4.2", optional = true, default-features = false }
embedded-hal = { version = "1.0", optional = true }
# The driver's command traits, for the bench's raw APDU pass-through (`Se05xChip::raw`).
iso7816 = { version = "0.2", optional = true, default-features = false }

[target.'cfg(not(target_os = "none"))'.dependencies]
getrandom = { version = "0.2", optional = true }

[dev-dependencies]
hkdf = { version = "0.12.4", default-features = false }
x509-cert = { version = "0.2", default-features = false }
hex = { workspace = true }
ed25519-dalek = { version = "2", default-features = false }
minicbor = { version = "2.3", default-features = false, features = ["alloc", "derive"] }
