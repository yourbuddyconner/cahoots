[package]
name = "cahoots-meshtastic"
description = "Meshtastic channel keys from a Cahoots circle: issue and accept over the Numbers Station, output the channel URL and CLI command."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cahoots-mesh"
path = "src/main.rs"

[dependencies]
cahoots-core = { workspace = true, features = ["std"] }
cahoots-provider = { workspace = true }
cahoots-relay = { path = "../relay" }
cahoots-wireguard = { path = "../wireguard" }
base64 = "0.22"
hex = "0.4"
serde_json = "1"
zeroize = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }

[dev-dependencies]
tempfile = "3"
