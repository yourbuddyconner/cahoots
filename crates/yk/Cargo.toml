[package]
name = "cahoots-yk"
description = "YubiKey OpenPGP GET CHALLENGE entropy source and CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "cahoots_yk"
path = "src/lib.rs"

[[bin]]
name = "cahoots-yk"
path = "src/main.rs"

[dependencies]
cahoots-hal = { workspace = true }
pcsc = "2.9"
clap = { version = "4.5", features = ["derive"] }
