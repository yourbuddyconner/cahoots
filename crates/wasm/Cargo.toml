[package]
name = "cahoots-wasm"
description = "cahoots-core bindings for the browser client."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
cahoots-core = { workspace = true, features = ["std"] }
cahoots-chat = { path = "../chat", default-features = false }
# `std` for the owner and member cores and their HPKE key deposits; the wasm target has std.
cahoots-channel = { workspace = true, features = ["std"] }
wasm-bindgen = "0.2.100"
raptorq = "2.0.0"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
rqrr = "0.11"
base64 = "0.22.1"
zeroize = "1.8"
# `js` also serves the channel crate's draws, which use the same `getrandom`.
getrandom = { version = "0.2", features = ["js"] }
rand_core = { version = "0.6", features = ["getrandom"] }

[dev-dependencies]
cahoots-objects = { workspace = true, features = ["std"] }
cahoots-relay = { path = "../relay" }
hex = { workspace = true, features = ["std"] }
minicbor = { version = "2.3", default-features = false, features = ["alloc"] }
sha2 = { workspace = true }


[package.metadata.wasm-pack.profile.release]
wasm-opt = false
