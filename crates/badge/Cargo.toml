[package]
name = "cahoots-badge"
description = "The badge's behaviour, written once against a Board trait. no_std + alloc."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
std = ["cahoots-core/std", "cahoots-hal/std", "cahoots-custodian/std"]

[dependencies]
cahoots-core = { workspace = true }
cahoots-hal = { workspace = true }
cahoots-custodian = { workspace = true }
cahoots-chip = { workspace = true }
minicbor = { version = "2.3", default-features = false, features = ["alloc", "derive"] }
sha2 = { workspace = true }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
ed25519-dalek = { version = "2", default-features = false }
zeroize = { workspace = true, features = ["alloc"] }
embedded-graphics = { version = "0.8", default-features = false }
profont = { version = "0.7", default-features = false }

[dev-dependencies]
cahoots-core = { workspace = true, features = ["std"] }
cahoots-chip = { workspace = true, features = ["std"] }
ssh-key = { version = "0.6", default-features = false, features = ["alloc", "ecdsa", "ed25519", "p256", "rand_core", "getrandom"] }
ssh-encoding = { version = "0.2", default-features = false, features = ["alloc"] }
rand_core = { version = "0.6", features = ["getrandom"] }
signature = "2"
