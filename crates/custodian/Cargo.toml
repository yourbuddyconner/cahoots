[package]
name = "cahoots-custodian"
description = "The custodian contract: spend pad bytes as keys, behind one trait shared by firmware and software."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
std = ["cahoots-core/std"]

[dependencies]
cahoots-core = { workspace = true }
zeroize = { workspace = true, features = ["alloc"] }
minicbor = { version = "2.3", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
cahoots-core = { workspace = true, features = ["std"] }
