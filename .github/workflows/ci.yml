name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown, thumbv7em-none-eabi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-features --all-targets -- -D warnings
      - run: cargo test --workspace --all-features
      - name: core builds no_std (thumbv7em)
        run: cargo build -p cahoots-core -p cahoots-hal -p cahoots-chat -p cahoots-custodian -p cahoots-badge -p cahoots-objects --no-default-features --target thumbv7em-none-eabi
      - name: core and wasm bindings build for wasm32
        run: cargo build -p cahoots-core -p cahoots-wasm --target wasm32-unknown-unknown
      - name: vectors are up to date
        run: |
          cargo run -p cahoots-vectors -- --check

  wg-demo:
    name: WireGuard tunnel from a cahoot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.94"
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y wireguard-tools
      - run: scripts/wg-demo.sh
