<text x="700" y="492" font-size="11" fill="#444">Their other end is one keyed plug</text>
<text x="700" y="506" font-size="11" fill="#444">into the module's socket. Colours are</text>
<text x="700" y="520" font-size="11" fill="#444">the usual ones; the printed names win.</text>
<text x="700" y="538" font-size="11" fill="#444">Module end, back of the board, text upright:</text>
