<rect x="708" y="624" width="10" height="5" fill="#9a9a9a"/>
<text x="728" y="630" font-size="9" font-weight="700" fill="#ffffff">CLK</text>
<rect x="708" y="636" width="10" height="5" fill="#9a9a9a"/>
<text x="728" y="642" font-size="9" font-weight="700" fill="#ffffff">DIN</text>
<rect x="708" y="648" width="10" height="5" fill="#9a9a9a"/>
<text x="728" y="654" font-size="9" font-weight="700" fill="#ffffff">GND</text>
<rect x="708" y="660" width="10" height="5" fill="#9a9a9a"/>
<text x="728" y="666" font-size="9" font-weight="700" fill="#ffffff">VCC</text>
<text x="706" y="682" font-size="9" font-weight="700" fill="#ffffff">Waveshare</text>
<text x="790" y="596" font-size="9" fill="#ffffff">The plug is keyed, so the wires leave</text>
<text x="790" y="609" font-size="9" fill="#ffffff">the socket in this same order.</text>
<text x="790" y="622" font-size="9" fill="#ffffff">VCC is the pin nearest the</text>
<text x="790" y="635" font-size="9" fill="#ffffff">Waveshare logo; BUSY is the</text>
<text x="790" y="648" font-size="9" fill="#ffffff">one nearest the title.</text>
