<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cahoots launch video</title>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js", "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/" } }
</script>
<style>
  :root { --bg: #0a0a0b; --fg: #f4f4f5; --fg-2: #a1a1aa; --amber: #e5a33a; }
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--bg); }
  body { font-family: "Inter", system-ui, sans-serif; color: var(--fg); -webkit-font-smoothing: antialiased; }
  #gl { position: absolute; inset: 0; width: 1920px; height: 1080px; }
  #glow { position: absolute; left: 50%; top: 45%; width: 1100px; height: 640px; transform: translate(-50%, -50%); background: radial-gradient(ellipse at center, rgba(229,163,58,0.12), rgba(229,163,58,0.03) 45%, transparent 70%); filter: blur(24px); mix-blend-mode: screen; pointer-events: none; }
  #overlay { position: absolute; inset: 0; }
  #overlay > div { position: absolute; }
  .w { display: inline-block; white-space: pre; }
  .w + .w { margin-left: 0.26em; }
  .head { left: 160px; bottom: 150px; width: 1000px; font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 84px; line-height: 1.02; letter-spacing: -0.035em; }
  .cubehead { width: 1400px; }
  .cubehead .line { display: block; }
  .cubewrap { perspective: 1200px; perspective-origin: 50% 50%; }
  .cube { position: relative; display: block; height: 1.02em; transform-style: preserve-3d; transform-origin: 50% 50%; }
  .cube .face { position: absolute; left: 0; top: 0; white-space: nowrap; backface-visibility: hidden; }
  .cube .face.a { transform: translateZ(0.51em); }
  .cube .face.b { transform: rotateX(90deg) translateZ(0.51em); }
  .wordmark { left: 50%; top: 50%; transform: translate(-50%, -50%); margin-left: 56px; font-family: "Inter Tight", sans-serif; font-weight: 600; font-size: 132px; letter-spacing: -0.03em; }
  #mark { position: absolute; left: 50%; top: 50%; width: 84px; height: 84px; transform: translate(-50%, -50%); margin-left: -268px; opacity: 0; }
  .label { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 36px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); left: 1400px; }
  .label::before { content: ""; display: inline-block; width: 28px; height: 2px; background: var(--amber); margin: 0 18px 12px 0; vertical-align: middle; }
  .l0 { top: 190px; } .l1 { top: 290px; } .l2 { top: 390px; } .l3 { top: 490px; } .l4 { top: 590px; }
  .node { font-family: "JetBrains Mono", monospace; font-weight: 500; font-size: 36px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--amber); transform: translateX(-50%); white-space: nowrap; }
  .url { left: 160px; bottom: 100px; font-family: "JetBrains Mono", monospace; font-weight: 400; font-size: 44px; color: var(--fg-2); letter-spacing: 0.02em; }
  #tickerwrap { position: absolute; left: 0; right: 0; bottom: 0; border-top: 1px solid rgba(255,255,255,0.08); padding: 18px 0; font-family: "JetBrains Mono", monospace; font-size: 20px; letter-spacing: 0.14em; color: #6b6b74; white-space: nowrap; overflow: hidden; opacity: 0; }
  #ticker { display: inline-block; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,0,0,0.45) 100%); pointer-events: none; }
  #grain { position: absolute; inset: 0; opacity: 0.06; mix-blend-mode: overlay; pointer-events: none; background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='300' height='300'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 1 0'/></filter><rect width='300' height='300' filter='url(%23n)'/></svg>"); }
  #fade { position: absolute; inset: 0; background: #000; opacity: 0; }
</style>
</head>
<body>
<canvas id="gl" width="1920" height="1080"></canvas>
<div id="glow"></div>
<div id="overlay"></div>
<img id="mark" src="../../site/assets/mark.svg" alt="">
<div id="tickerwrap"><span id="ticker"></span></div>
<div id="vignette"></div>
<div id="grain"></div>
<div id="fade"></div>
<script type="module" src="../out/scene.js"></script>
</body>
</html>
